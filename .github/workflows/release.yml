name: Release Build - Ramparts and Highflame Ramparts Server

on:
  release:
    types:
      - published

env:
  PY_VER: 3.11.8
  RELEASE_BRANCH: "main"
  REGEX_PATTERN: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  RELEASE_NAME: ${{ github.event.release.name }}
  DEVOPS_REPO: "highflame-cloud"
  DEVOPS_BRANCH: "main"
  RELEASE_TRIGGER: "enable"
  RELEASE_WORKFLOW: "trigger-release-deploy-ramparts-server.yml"

jobs:
  reusable-vars:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: reusable variables
        run: echo "Exposing env vars"
    outputs:
      RELEASE_TRIGGER: ${{ env.RELEASE_TRIGGER }}

  highflame-validate:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Tag format gate. Previously this step was conditioned on
      # `steps.validate_branch.outputs.enable_branch_build == 'true'`,
      # but `validate_branch` was never a real step in this job — the
      # gate evaluated to false and the validation silently skipped on
      # every release. Removed the conditional; the format check now
      # actually runs. (Same bug + fix as zeroid's release.yml.)
      - name: Validate Release Tag
        id: validate_tag
        shell: bash
        run: |-
          if [[ "${{ env.RELEASE_NAME }}" =~ ${{ env.REGEX_PATTERN }} ]] ; then
            echo "Valid version format: ${{ env.RELEASE_NAME }}"
          else
            echo "Invalid version format: ${{ env.RELEASE_NAME }}"
            echo "Expected bare semver (X.Y.Z); got: ${{ env.RELEASE_NAME }}"
            exit 1
          fi

      # convco (Rust equivalent of caarlos0/svu — same Conventional
      # Commits model) computes the semver bump implied by commit
      # messages since the last tag. Highflame's commit-prefix
      # convention maps cleanly onto Conventional Commits for the
      # bumps: `feat:` -> minor, `fix:` -> patch, `feat!:` /
      # `BREAKING CHANGE:` -> major. `devops:`, `build(deps)`,
      # `[Snyk]`, `Bump`, `Merge`, `Revert` aren't in convco's default
      # type table and don't move version numbers — matches our intent
      # (housekeeping, not user-visible).
      #
      # Behavior: fail if the published tag is BELOW convco's
      # recommendation — that means a `feat:` commit was missed and
      # we'd be silently shipping a feature as a patch. Allow tags AT
      # OR ABOVE the recommendation so a maintainer can manually force
      # a higher bump (e.g., release a major from a fix-only window).
      # Note: convco's pre-1.0 bump heuristic is more conservative than
      # svu's; this is fine here because the check is one-way (fail on
      # too-low) — false negatives (a missed under-bump) hurt less than
      # false positives (blocking a correct release).
      #
      # ramparts uses bare semver tags (X.Y.Z, no `v` prefix); convco's
      # `--prefix ""` outputs the same shape so no string munging is
      # needed. Installed from the prebuilt binary release rather than
      # `cargo install convco` so the job doesn't burn a few minutes
      # compiling the tool on every release.
      - name: Validate semver against commit history (convco)
        shell: bash
        run: |-
          set -euo pipefail
          CONVCO_VERSION="0.6.3"
          curl -fsSL "https://github.com/convco/convco/releases/download/v${CONVCO_VERSION}/convco-ubuntu.zip" -o /tmp/convco.zip
          unzip -q /tmp/convco.zip -d /tmp/convco-bin
          sudo install -m 0755 /tmp/convco-bin/convco /usr/local/bin/convco

          # Critical: at release-publish time the just-pushed tag is
          # already at HEAD. `convco version --bump` would then see it
          # as "the latest tag" and report zero bump (no commits past
          # HEAD), making the check trivially pass on every release.
          # Delete the tag from the LOCAL clone before computing — the
          # remote still has it (the GitHub release isn't affected) —
          # so convco sees the PREVIOUS tag as the latest and computes
          # the bump from commits between previous-tag and HEAD. That's
          # what we actually want to validate.
          ACTUAL="${{ env.RELEASE_NAME }}"
          if git rev-parse --verify --quiet "refs/tags/${ACTUAL}" >/dev/null; then
            git tag -d "${ACTUAL}" >/dev/null
            echo "Removed local tag ${ACTUAL} so convco computes the bump from the previous tag."
          else
            # Tag wasn't fetched into the local clone. Warn loudly —
            # convco's output may be off but the comparison still
            # catches gross under-bumps.
            echo "::warning::Local tag ${ACTUAL} not found; convco computation may be skewed."
          fi

          EXPECTED="$(convco version --bump --prefix '')"
          if [[ -z "${EXPECTED}" ]]; then
            echo "::error::convco returned an empty recommendation. Cannot validate."
            exit 1
          fi
          echo "Published tag : ${ACTUAL}"
          echo "convco --bump : ${EXPECTED}"
          HIGHEST="$(printf '%s\n%s\n' "${EXPECTED}" "${ACTUAL}" | sort -V | tail -1)"
          if [[ "${ACTUAL}" != "${EXPECTED}" && "${HIGHEST}" != "${ACTUAL}" ]]; then
            echo "::error::Release tag ${ACTUAL} is below convco's computed next version ${EXPECTED}."
            echo "::error::This usually means a feat: commit since the last tag implied a minor bump."
            echo "::error::Either retag at ${EXPECTED} or higher, or audit recent commit prefixes."
            exit 1
          fi
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::notice::Release tag ${ACTUAL} is ahead of convco's recommendation (${EXPECTED}). Treating as an intentional manual bump."
          else
            echo "Release tag matches convco recommendation."
          fi

      # Stamp the release version into every place a version literal
      # appears. Today that's the root Cargo.toml and `common/Cargo.toml`
      # (the `ramparts-common` workspace member). Both files need to
      # match — drifting versions inside a single workspace either
      # break `cargo publish` outright or ship a confusing mix of
      # `[[package]]` entries in the eventual crate metadata.
      #
      # `Cargo.lock` is refreshed implicitly by the downstream `cargo
      # build` / `cargo publish` steps (Cargo regenerates lock entries
      # for workspace members whenever their Cargo.toml `version`
      # changes), so we don't sed it here.
      #
      # The hardcoded `"version": "0.2.0"` literals in
      # `src/server.rs` (health-endpoint JSON) are intentionally NOT
      # patched here — those are a source-level bug that should be
      # refactored to use `env!("CARGO_PKG_VERSION")` instead of being
      # papered over at release time. Tracked separately.
      - name: Stamp release version into Cargo.toml files
        shell: bash
        run: |-
          set -euo pipefail
          for f in Cargo.toml common/Cargo.toml; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Expected $f to exist; aborting release."
              exit 1
            fi
            sed -i 's/^version = ".*"/version = "${{ env.RELEASE_NAME }}"/' "$f"
            actual="$(grep -m1 '^version = ' "$f" | cut -d'"' -f2)"
            if [[ "$actual" != "${{ env.RELEASE_NAME }}" ]]; then
              echo "::error::$f version did not update to ${{ env.RELEASE_NAME }} (got: $actual)"
              exit 1
            fi
            echo "Stamped $f -> $actual"
          done

      # The downstream `highflame-artifact` job runs on separate
      # runners (matrix-based), so the in-place edits above don't
      # propagate via the working directory. We bundle the patched
      # files into an artifact that job downloads to overlay before
      # building. Preserves the relative path (`common/Cargo.toml`)
      # so the workspace structure is intact when the artifact
      # unpacks.
      #
      # In the normal release-plz flow this is redundant (release-plz
      # already merged the version bump into main before tagging, so
      # the checkout in `highflame-artifact` has the right
      # Cargo.toml versions). The sed + artifact transport is a
      # safety net for manual-tag releases that bypass release-plz.
      - name: Upload version-stamped Cargo.toml files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-toml
          path: |
            Cargo.toml
            common/Cargo.toml
          retention-days: 1

  highflame-artifact:
    needs:
      - highflame-validate
    permissions:
      contents: 'read'
    strategy:
      matrix:
        include:
          - target: ubuntu-24.04
            arch: x86_64
          - target: windows-2022
            arch: x86_64
          - target: macOS-15
            arch: x86_64
          - target: macOS-15
            arch: aarch64
    runs-on: ${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download cargo-toml
        uses: actions/download-artifact@v7
        with:
          name: cargo-toml

      - name: Check Cargo.toml
        shell: bash
        run: |-
          cat Cargo.toml

      - name: Setting up Envs
        id: set_env
        shell: bash
        run: |-
          if [[ ${{ matrix.target }} == "ubuntu-24.04" && ${{ matrix.arch }} == "x86_64" ]] ; then
            echo "crate_target=x86_64-unknown-linux-gnu" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-linux-x86_64" >> ${GITHUB_OUTPUT}
            echo "crate_ext=" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "windows-2022" && ${{ matrix.arch }} == "x86_64" ]] ; then
            echo "crate_target=x86_64-pc-windows-msvc" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-windows-x86_64.exe" >> ${GITHUB_OUTPUT}
            echo "crate_ext=.exe" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "macOS-15" && ${{ matrix.arch }} == "x86_64" ]] ; then
            echo "crate_target=x86_64-apple-darwin" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-macos-x86_64" >> ${GITHUB_OUTPUT}
            echo "crate_ext=" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "macOS-15" && ${{ matrix.arch }} == "aarch64" ]] ; then
            echo "crate_target=aarch64-apple-darwin" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-macos-aarch64" >> ${GITHUB_OUTPUT}
            echo "crate_ext=" >> ${GITHUB_OUTPUT}
          else
            echo "Not matching the target...!"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.set_env.outputs.crate_target }}

      - name: Install YARA (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yara libyara-dev

      - name: Install YARA (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install yara
          # Set environment variables for yara-sys
          echo "YARA_LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/opt/homebrew/include" >> $GITHUB_ENV
          # Also set for Intel Macs
          if [ -d "/usr/local/lib" ]; then
            echo "YARA_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV
            echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/local/include" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Install YARA (Windows)
        if: runner.os == 'Windows'
        run: |
          # Windows doesn't have a standard YARA package manager
          # We'll build without YARA features for Windows
          echo "YARA not available on Windows, will build without YARA features"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo build --release --target ${{ steps.set_env.outputs.crate_target }} --no-default-features
          else
            cargo build --release --target ${{ steps.set_env.outputs.crate_target }}
          fi
        shell: bash

      - name: Create release assets
        run: |
          mkdir -p release
          cp target/${{ steps.set_env.outputs.crate_target }}/release/ramparts${{ steps.set_env.outputs.crate_ext }} release/${{ steps.set_env.outputs.crate_release }}

          # Create checksums
          cd release
          sha256sum * > ${{ matrix.target }}-${{ matrix.arch }}_checksums.txt
        shell: bash

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            - ${{ github.repository }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release/${{ steps.set_env.outputs.crate_release }}
          asset_name: ${{ steps.set_env.outputs.crate_release }}
          asset_content_type: application/octet-stream

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release/${{ matrix.target }}-${{ matrix.arch }}_checksums.txt
          asset_name: ${{ matrix.target }}-${{ matrix.arch }}_checksums.txt
          asset_content_type: text/plain

  # NOTE: the cargo-publish job that used to live here has been
  # removed. release-plz now publishes to crates.io as part of its
  # full-mode flow — when a release-plz PR is merged, release-plz
  # tags + publishes the crate + creates the GitHub release (as a
  # draft, see release-plz.toml). The maintainer polishes the draft
  # release notes and clicks "Publish release", which fires this
  # workflow on `release: published` and builds the multi-arch
  # binaries that get attached.
  #
  # If you need to bypass release-plz and publish a release
  # manually (e.g., release-plz workflow is broken), do it from a
  # checkout of the release tag:
  #
  #   git checkout 0.X.0
  #   cargo publish --allow-dirty
  #
  # The sed step above (`Stamp release version into Cargo.toml
  # files`) is the safety net that bridges manual tags whose
  # Cargo.toml wasn't pre-bumped by release-plz.

  highflame-trigger:
    needs:
      - reusable-vars
      - highflame-artifact
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-24.04
    if: (needs.reusable-vars.outputs.RELEASE_TRIGGER == 'enable')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            - ${{ github.repository }}
            - ${{ env.DEVOPS_REPO }}

      - name: Trigger private repo workflow
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh workflow run ${{ env.RELEASE_WORKFLOW }} \
            --repo ${{ github.repository_owner }}/${{ env.DEVOPS_REPO }} \
            --ref ${{ env.DEVOPS_BRANCH }} -f RELEASE_TAG=${{ env.RELEASE_NAME }}
