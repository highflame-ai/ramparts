name: Release Build - Ramparts

on:
  release:
    types:
      - published

env:
  PY_VER: 3.11.8
  RELEASE_BRANCH: "main"
  REGEX_PATTERN: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  RELEASE_NAME: ${{ github.event.release.name }}

jobs:
  highflame-validate:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate Release Tag
        id: validate_tag
        shell: bash
        run: |-
          if [[ "${{ env.RELEASE_NAME }}" =~ ${{ env.REGEX_PATTERN }} ]] ; then
            echo "Valid version format: ${{ env.RELEASE_NAME }}"
          else
            echo "Invalid version format: ${{ env.RELEASE_NAME }}"
            echo "Expected v-prefixed semver (vX.Y.Z); got: ${{ env.RELEASE_NAME }}"
            exit 1
          fi

      - name: Stamp release version into Cargo.toml files
        shell: bash
        run: |-
          set -euo pipefail
          VERSION=$(echo "$RELEASE_NAME" | sed 's|^v||g')
          echo "Releasing version: $VERSION"
          for f in Cargo.toml common/Cargo.toml; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Expected $f to exist; aborting release."
              exit 1
            fi
            sed -i "s|^version = \".*\"|version = \"$VERSION\"|" "$f"
            actual="$(grep -m1 '^version = ' "$f" | cut -d'"' -f2)"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error::$f version did not update to $VERSION (got: $actual)"
              exit 1
            fi
            echo "Stamped $f -> $actual"
          done

      - name: Upload version-stamped Cargo.toml files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-toml
          path: |
            Cargo.toml
            common/Cargo.toml
          retention-days: 1

  highflame-artifact:
    needs:
      - highflame-validate
    permissions:
      contents: 'read'
    strategy:
      matrix:
        include:
          - target: ubuntu-24.04
            arch: x86_64
          - target: windows-2022
            arch: x86_64
          - target: macOS-15
            arch: x86_64
          - target: macOS-15
            arch: aarch64
          # GitHub-hosted native arm64 runners (free for public repos).
          # Building natively avoids cross-compiling the YARA C dep for
          # aarch64 — the OS-keyed YARA/build steps below work unchanged.
          - target: ubuntu-24.04-arm
            arch: aarch64
          - target: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download cargo-toml
        uses: actions/download-artifact@v7
        with:
          name: cargo-toml

      - name: Check Cargo.toml
        shell: bash
        run: |-
          for f in Cargo.toml common/Cargo.toml; do
            echo "printing contents of $f"
            cat $f
          done

      - name: Setting up Envs
        id: set_env
        shell: bash
        run: |-
          if [[ ${{ matrix.target }} == "ubuntu-24.04" && ${{ matrix.arch }} == "x86_64" ]] ; then
            echo "crate_target=x86_64-unknown-linux-gnu" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-linux-x86_64" >> ${GITHUB_OUTPUT}
            echo "crate_ext=" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "windows-2022" && ${{ matrix.arch }} == "x86_64" ]] ; then
            echo "crate_target=x86_64-pc-windows-msvc" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-windows-x86_64.exe" >> ${GITHUB_OUTPUT}
            echo "crate_ext=.exe" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "macOS-15" && ${{ matrix.arch }} == "x86_64" ]] ; then
            echo "crate_target=x86_64-apple-darwin" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-macos-x86_64" >> ${GITHUB_OUTPUT}
            echo "crate_ext=" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "macOS-15" && ${{ matrix.arch }} == "aarch64" ]] ; then
            echo "crate_target=aarch64-apple-darwin" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-macos-aarch64" >> ${GITHUB_OUTPUT}
            echo "crate_ext=" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "ubuntu-24.04-arm" && ${{ matrix.arch }} == "aarch64" ]] ; then
            echo "crate_target=aarch64-unknown-linux-gnu" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-linux-aarch64" >> ${GITHUB_OUTPUT}
            echo "crate_ext=" >> ${GITHUB_OUTPUT}
          elif [[ ${{ matrix.target }} == "windows-11-arm" && ${{ matrix.arch }} == "aarch64" ]] ; then
            echo "crate_target=aarch64-pc-windows-msvc" >> ${GITHUB_OUTPUT}
            echo "crate_release=ramparts-windows-aarch64.exe" >> ${GITHUB_OUTPUT}
            echo "crate_ext=.exe" >> ${GITHUB_OUTPUT}
          else
            echo "Not matching the target...!"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.set_env.outputs.crate_target }}

      - name: Install YARA (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yara libyara-dev

      - name: Install YARA (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install yara
          # Set environment variables for yara-sys
          echo "YARA_LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/opt/homebrew/include" >> $GITHUB_ENV
          # Also set for Intel Macs
          if [ -d "/usr/local/lib" ]; then
            echo "YARA_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV
            echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/local/include" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Install YARA (Windows)
        if: runner.os == 'Windows'
        run: |
          # Windows doesn't have a standard YARA package manager
          # We'll build without YARA features for Windows
          echo "YARA not available on Windows, will build without YARA features"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo build --release --target ${{ steps.set_env.outputs.crate_target }} --no-default-features
          else
            cargo build --release --target ${{ steps.set_env.outputs.crate_target }}
          fi
        shell: bash

      - name: Create release assets
        run: |
          mkdir -p release
          cp target/${{ steps.set_env.outputs.crate_target }}/release/ramparts${{ steps.set_env.outputs.crate_ext }} release/${{ steps.set_env.outputs.crate_release }}

          # Create checksums
          cd release
          sha256sum * > ${{ matrix.target }}-${{ matrix.arch }}_checksums.txt
        shell: bash

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release/${{ steps.set_env.outputs.crate_release }}
          asset_name: ${{ steps.set_env.outputs.crate_release }}
          asset_content_type: application/octet-stream

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release/${{ matrix.target }}-${{ matrix.arch }}_checksums.txt
          asset_name: ${{ matrix.target }}-${{ matrix.arch }}_checksums.txt
          asset_content_type: text/plain

  highflame-crate:
    needs:
      - highflame-artifact
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download cargo-toml
        uses: actions/download-artifact@v7
        with:
          name: cargo-toml

      - name: Check Cargo.toml
        shell: bash
        run: |-
          for f in Cargo.toml common/Cargo.toml; do
            echo "printing contents of $f"
            cat $f
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install YARA (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yara libyara-dev

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |-
          # cargo publish --allow-dirty Cargo.toml --allow-dirty Cargo.lock
          cargo publish --allow-dirty
