name: Release Build - Highflame Ramparts Server

on:
  release:
    types:
      - published

env:
  DEVOPS_REPO: "highflame-cloud"
  DEVOPS_BRANCH: "main"
  CICD_TRIGGER: "enable"
  CICD_WORKFLOW: "trigger-release-deploy-ramparts-server.yml"

jobs:
  reusable-vars:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: reusable variables
        run: echo "Exposing env vars"
    outputs:
      CICD_TRIGGER: ${{ env.CICD_TRIGGER }}

  reusable-workflow-validate:
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: highflame-ai/highflame-workflow/.github/workflows/workflow-release-validate.yml@v2.0

  highflame-trigger:
    needs:
      - reusable-vars
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-24.04
    if: (needs.reusable-vars.outputs.CICD_TRIGGER == 'enable')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger private repo workflow
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh workflow run ${{ env.CICD_WORKFLOW }} \
            --repo ${{ github.repository_owner }}/${{ env.DEVOPS_REPO }} \
            --ref ${{ env.DEVOPS_BRANCH }}
            -f release_tag=${{ github.event.release.tag_name }}