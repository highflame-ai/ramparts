[package]
name = "ramparts"
version = "0.8.0"
edition = "2021"
authors = ["Sharath Rajasekar <sharath@highflame.com>"]
description = "Security scanner for Model Context Protocol (MCP) servers and AI agent skills (Claude Code commands, agentskills.io bundles, Cursor / Codex / Windsurf / Gemini equivalents)."
license = "Apache-2.0"
repository = "https://github.com/highflame-ai/ramparts"
keywords = ["mcp", "scanner", "skills", "llm", "security"]
categories = ["command-line-utilities", "development-tools::testing"]
include = ["src/**/*", "LICENSE", "README.md", "build.rs"]

# Cargo-release configuration for semantic versioning
[package.metadata.release]
allow-branch = ["main", "master"]
tag = true
push = true
tag-name = "v{version}"
sign-commit = false
sign-tag = false

[features]
default = ["yara-x-scanning"]
yara-x-scanning = ["yara-x", "glob"]

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }

# Async streams
futures-util = "0.3"
futures = "0.3"

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
schemars = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# URL parsing
url = "2.4"

# Regular expressions for environment variable expansion
regex = "1.10"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Table formatting for output
tabled = "0.20"

# Configuration
config = "0.14"

# Directory handling
dirs = "5.0"

# File pattern matching for dynamic YARA rules
glob = { version = "0.3", optional = true }

# Color output
colored = "2.0"
spinners = "4.1.1"

# Web framework for microservice
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = "0.4"

# JSON-RPC handling for microservice
jsonrpc-core = "18.0"
# Pinned to a post-v1.16.0 commit that bumps wasmtime from 43.0.1 to
# 43.0.2, clearing RUSTSEC-2026-0114 (panic when allocating a table
# exceeding the host's address space). Previous pin (178e2d697a, the
# original wasmtime 43.0.1 bump) is still vulnerable. yara-x's tagged
# v1.16.0 release ships the OLD wasmtime, so we hold the git pin
# until v1.17 lands with the fix included. Switch back to a published
# crates.io version then.
yara-x = { git = "https://github.com/VirusTotal/yara-x", rev = "664cdfe66fd40826d160fa7009966d9c8a43cba6", optional = true }

# Official Rust MCP SDK
rmcp = { version = "1.5", features = [
    "client",
    "server",
    "macros",
    "schemars",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-worker",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session"
] }

# Random number generation for request IDs
rand = "0.9"

# Pulled in transitively via reqwest 0.13 / hyper-rustls; we declare it
# directly so we can install the process-wide CryptoProvider explicitly at
# startup AND build a `ClientConfig` whose root cert store is the bundled
# Mozilla CA list (see `webpki-roots` below). Without that, reqwest 0.13's
# default `rustls` feature pulls in `rustls-platform-verifier`, which has
# been observed to fail with "No CA certificates were loaded from the
# system" on some macOS configurations.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Mozilla's CA bundle, ahead-of-time. We use this instead of the OS trust
# store so HTTPS connectivity is reproducible across environments and not
# subject to platform-verifier's "no CAs loaded" failure mode.
webpki-roots = "1"

# Bring in common as path dependency
ramparts-common = { path = "common" }

# Atomic file writes for `scan-config --fix` (NamedTempFile::persist handles
# Windows replace-existing semantics that plain rename does not).
tempfile = "3.8"

# Unified diff rendering for `scan-config --dry-run` / `--fix`.
similar = "2"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
# Serialise tests that mutate process-wide environment variables. Several
# tests in `integration_tests.rs` race on `LLM_API_KEY` / `X_API_KEY` /
# `API_KEY` and flake under parallel execution.
serial_test = "3"
