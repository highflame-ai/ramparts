[package]
name = "ramparts-common"
# Bumped to 0.8.1 in lockstep with the root crate. ramparts-common
# is being published to crates.io for the first time as part of
# this version (see release-plz.toml `publish = true`).
version = "0.8.1"
edition = "2021"
authors = ["Sharath Rajasekar <sharath@highflame.com>"]
description = "Shared types and utilities for the Ramparts MCP-server and agent-skill scanner."
license = "Apache-2.0"
repository = "https://github.com/highflame-ai/ramparts"

[dependencies]
# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.4"
regex = "1.10"

# Async utilities
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }

# Official Rust MCP SDK
rmcp = { version = "3.1", features = [
    "client",
    "server",
    "macros",
    "schemars",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-worker",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session"
] }

# File system operations
dirs = "5.0"
